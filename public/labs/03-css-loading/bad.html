<!doctype html>
<html lang="uk">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS Loading - bad</title>

    <link rel="stylesheet" href="/assets/css/import-entry.css?delay=2000" />

    <script src="/metrics-helper.js?v=4" defer></script>

  <body>
    <a class="back-link" href="/">Dashboard</a>

      <section class="hero">

        <img
          class="hero-image"
