<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Baseline - control</title>

    <link rel="stylesheet" href="/assets/css/baseline-layout.css">

    <!-- This stylesheet is intentionally delayed.
      The LCP image is hidden inside its background-image rule, so the browser
      cannot request hero.png until this CSS file is downloaded and parsed. -->
    <link rel="stylesheet" href="/assets/css/baseline-late-hero.css?delay=1400">
  </head>
  <body>
    <a class="back-link" href="/">Dashboard</a>

    <main>
      <section class="variant-strip">
        <span>Baseline</span>
        <strong>control</strong>
      </section>

      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">01 Baseline</p>
          <h1>Контрольний waterfall</h1>
          <p>LCP image навмисно схований у delayed CSS, щоб request для hero.png стартував пізніше.</p>
        </div>
        <div class="lcp-image-block" role="img" aria-label="LCP resource visualization"></div>
      </section>
    </main>

    <script>
      const prefix = "[01-baseline]";

      new PerformanceObserver((entryList) => {
        for (const entry of entryList.getEntries()) {
          console.log(`${prefix} ${entry.name}: ${entry.startTime.toFixed(0)}ms`);
        }
      }).observe({ type: "paint", buffered: true });

      new PerformanceObserver((entryList) => {
        const entry = entryList.getEntries().at(-1);
        const element = entry.element
          ? `${entry.element.tagName.toLowerCase()}${entry.element.className ? `.${entry.element.className}` : ""}`
          : "unknown";
        const url = entry.url || "text";

        console.log(`${prefix} LCP candidate: ${entry.startTime.toFixed(0)}ms ${element} ${url}`);
      }).observe({ type: "largest-contentful-paint", buffered: true });
    </script>
  </body>
</html>
